---
layout: default
---
<article class="issue sec-articles">
  <header class="issue-head">
    <a class="tab" href="{{ '/articles/' | relative_url }}">文章</a>
    <h1>{{ page.title }}</h1>
    <p class="issue-date"><time datetime="{{ page.date | date_to_xmlschema }}">{% include date_zh.html date=page.date %}</time></p>
    {%- if page.tags.size > 0 %}
    <ul class="tags" aria-label="標籤">{% for t in page.tags %}<li>{{ t }}</li>{% endfor %}</ul>
    {%- endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
