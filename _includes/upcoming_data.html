{%- comment -%}把各期快報 front matter 的 upcoming 與 _data/upcoming/ 的手動條目輸出成 JSON，給 assets/upcoming.js 使用。{%- endcomment -%}
<script id="up-data" type="application/json">{"hidden":[ {%- for pair in site.data.upcoming_hidden -%}{"k":{{ pair[1].key | append: "" | jsonify }},"f":{{ pair[0] | jsonify }}}{% unless forloop.last %},{% endunless %}{%- endfor -%} ],"sections":{ {%- for s in site.sections -%}{{ s.key | jsonify }}:{{ s.name | jsonify }}{% unless forloop.last %},{% endunless %}{%- endfor -%} },"items":[
{%- assign first = true -%}
{%- for p in site.posts -%}{%- for u in p.upcoming -%}
{%- unless first %},{% endunless %}{"d":{{ u.date | append: "" | jsonify }},"t":{{ u.title | jsonify }},"k":{{ u.kind | default: "" | jsonify }},"u":{{ u.url | default: "" | jsonify }},"s":{{ p.categories | jsonify }},"src":{{ p.url | relative_url | jsonify }},"srcT":{{ p.title | jsonify }}}
{%- assign first = false -%}
{%- endfor -%}{%- endfor -%}
{%- for pair in site.data.upcoming -%}{%- for u in pair[1] -%}
{%- unless first %},{% endunless %}{"d":{{ u.date | append: "" | jsonify }},"t":{{ u.title | jsonify }},"k":{{ u.kind | default: "" | jsonify }},"u":{{ u.url | default: "" | jsonify }},"s":{{ u.sections | jsonify }},"src":{% if u.source and u.source != "" %}{{ u.source | relative_url | jsonify }}{% else %}""{% endif %},"srcT":{{ u.source_title | default: "" | jsonify }}}
{%- assign first = false -%}
{%- endfor -%}{%- endfor -%}
]}</script>
<script src="{{ '/assets/upcoming.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
