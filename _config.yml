disclaimer: 本站內容由 AI 輔助整理公開資料而成，僅供研究參考，不構成法律意見。引用前請查核原始來源。

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  categories:
    - human-rights
    - gender
    - labour

exclude:
  - README.md
  - PUBLISHING.md
  - CLAUDE.md
  - Gemfile
