context: '高級專員指出，胡塞（Houthi）事實上當局封閉了塔伊茲通往亞丁的唯一補給路線，阻斷救援並推高物價。OHCHR 核實 8 月 1 日至 10 月 19 日間塔伊茲省有 32 名平民死亡（含 14 名兒童、9 名婦女）、115 人受傷。他要求無阻礙的人道通道、平民安全撤離、避免在人口稠密區使用具廣域效果的爆炸性武器，並再次要求釋放遭拘留的聯合國與 NGO 人員。'
